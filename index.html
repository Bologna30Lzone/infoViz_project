<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carousel D3 Panels — Modular</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Left navbar -->
  <nav class="navbar" aria-label="Quick navigation">
    <div class="nav-list" id="quickNav"></div>
  </nav>

  <div class="viewport" id="viewport" aria-roledescription="carousel" aria-label="Slides">
    <div class="top-right">
      <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous slide">◀</button>
      <button type="button" class="nav-btn" id="btnNext" aria-label="Next slide">▶</button>
    </div>

    <div class="track" id="track">
      <!-- HOME -->
      <section class="panel home" data-label="HOME" data-module="none">
        <div>
          <h1>Home</h1>
          <p>This is not the greatest paragraph in the world: This is just a Tribute</p>
        </div>
      </section>

      <!-- Q1 -->
      <section class="panel" data-label="Q. 1" data-module="bar">
        <div class="panel-inner">
          <div class="kicker">QUESTION ONE</div>
          <div class="headline"><span class="accent">Before</span> and After 30-Zone</div>
          <!--<div class="map-selector">
            <button data-map="map1">2019</button>
            <button data-map="map2">2020</button>
            <button data-map="map3">2021</button>
            <button data-map="map4">2022</button>
            <button data-map="map5">2023</button>
            <button data-map="map6">2024</button>
            <button data-map="map7">2025</button>
          </div>-->
          <div class="content">
            <div class="chart" data-type="heatmaps">
              <div class="map-selector">
                <button data-map="map1">2019</button>
                <button data-map="map2">2020</button>
                <button data-map="map3">2021</button>
                <button data-map="map4">2022</button>
                <button data-map="map5">2023</button>
                <button data-map="map6">2024</button>
                <button data-map="map7">2025</button>
              </div>
              <figure class="figure">
                <div class="map-container">
                  <iframe class="map-frame" id="map1" src="./maps/heatmapVie2019.html"></iframe>
                  <iframe class="map-frame" id="map2" src="./maps/heatmapVie2020.html"></iframe>
                  <iframe class="map-frame" id="map3" src="./maps/heatmapVie2021.html"></iframe>
                  <iframe class="map-frame" id="map4" src="./maps/heatmapVie2022.html"></iframe>
                  <iframe class="map-frame" id="map5" src="./maps/heatmapVie2023.html"></iframe>
                  <iframe class="map-frame" id="map6" src="./maps/heatmapVie2024.html"></iframe>
                  <iframe class="map-frame" id="map7" src="./maps/heatmapVie2025.html"></iframe>
                </div>
                <figcaption class="caption">› 2022 ‹</figcaption>
              </figure>
            </div>
            <div class="chart-block">
              <canvas id="streetChart"></canvas>
            </div>
          </div>
        </div>
      </section>

      <!-- Q2 (uses your bike line chart) -->
      <section class="panel" data-label="Q. 2" data-module="line">
        <div class="panel-inner">
          <div class="intro">
            <div class="kicker">QUESTION TWO</div>
            <div class="headline">BIKES</div>
          </div>
          <div class="content">

            <figure class="figure">
              <div class="bike-chart chart" data-type="bike-line"></div>
            </figure>
          </div>

        </div>
      </section>

      <!-- Q3 -->
      <section class="panel" data-label="Q. 3" data-module="bar">
        <div class="panel-inner">
          <div class="intro">
            <div class="kicker">QUESTION THREE</div>
            <div class="headline">This is question 3?</div>
          </div>

          <figure class="figure">
            <div class="charts-grid">
              <div class="chart" width="600" height="400" data-type="30-vs-non30" data-csv-url="data/df_30vsnon30.csv"></div>
            </div>
            <figcaption class="caption">› 2024 ‹</figcaption>
          </figure>

        </div>
      </section>

      <!-- Q4 -->
      <section class="panel" data-label="Q. 4" data-module="bar">
        <div class="panel-inner">
          <div class="intro">
            <div class="kicker">QUESTION FOUR</div>
            <div class="headline">
              How has <span class="accent">Air Quality</span> changed in the 30-zone?
            </div>
          </div>
          <div class="content" id="air">
            <figure class="figure wide-chart">
              <div class="chart" data-type="air-quality" data-gas-url="data/gases.json" style="height:40vh"></div>
              <div>

                <h3>Air Quality</h3>
                <p>We wanted to check if the new policy impacted air quality. In order to do that we used the data
                  collected by 2 air quality stations in near the city center (Porta San Felice and Giardini
                  Margherita).
                  Different gases were measured, each with their own consequences and thresholds. The thresholds
                  represent
                  the guidelines imposed by the European Union (EU) and the World Health organization for air quality.
                </p>
                <p>There is no general trend observable across the different gases, each has a different behaviour
                  through
                  the years, find out more about each gas by clicking the buttons under the graph:</p>
                <p id="gas-info">
                  <strong>PM10</strong> are tiny airborne particles from sources like dust and traffic that can be
                  inhaled, irritating
                  the lungs and worsening respiratory and heart conditions. The introduction of Città 30 had little
                  impact on their
                  presence.
                </p>
              </div>
            </figure>

            <figure class="figure wide-chart chart-right">
              <div>
                <h3>Electric Vehicle Usage</h3>
                <p>We also wanted to explore if there was some correlation between the change of air quality and the
                  growth of electric car vehicles. While it is true that the growth is of car vehicle show a positive
                  trend (+1% from 2019), the percentage over the the total count of cars is too little to have any
                  significant impact. </p>
              </div>
              <div class="chart" data-type="ev-share" data-ev-url="data/electric.csv" style="height:30vh"></div>
            </figure>

          </div>
      </section>

      <!-- END -->
      <section class="panel end" data-label="END" data-module="none">
        <div>
          <h1>End</h1>
          <p>kill me pls</p>
        </div>
      </section>
    </div>

    <div id="announce" class="sr-only" aria-live="polite"></div>
  </div>

  <!-- App (module) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
